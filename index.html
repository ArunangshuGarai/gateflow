<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Ensure window.fetch has a setter so Chrome extensions intercepting requests don't throw
        // "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        // Shield against third-party extension runtime errors bubbling to app overlay
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (file.indexOf('chrome-extension://') !== -1 || msg.indexOf('fetch of #<Window>') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event.reason && (event.reason.stack || event.reason.message || String(event.reason))) || '';
          if (reason.indexOf('chrome-extension://') !== -1 || reason.indexOf('fetch of #<Window>') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
